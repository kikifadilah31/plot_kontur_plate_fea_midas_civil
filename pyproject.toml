[project]
name = "shell-kit"
version = "3.1.0"
description = "shell-kit — Post-processing pelat/shell Midas Civil: kontur gaya dalam, desain tulangan SNI, dan laporan"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FEA Automation"},
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "typst>=0.15.0",
    "pillow>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
shell-kit = "shell_kit.cli:entry_point"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shell_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end CLI runs that render real plots",
]
